<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kovix — منصة التوجيهي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#fff;--ink:#0b1b3a;--mut:#5b6b8c;--b:#1f4bff;--bl:#eef2ff;--ln:#e3e8f5;--ok:#0f9d6b;--no:#e0394b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#fff;--ink:#0b1b3a}}
*{box-sizing:inherit;margin:0}button,input,select,textarea{color:var(--ink)}.opt{color:var(--ink)!important}.stp{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px}.stp .btn{width:100%}html{scroll-padding-top:70px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
.en{font-family:'Space Grotesk','IBM Plex Sans Arabic',sans-serif;direction:ltr;display:inline-block}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:6px;padding:12px 5vw;background:#ffffffee;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);overflow-x:auto;white-space:nowrap}
nav b{font-size:22px;margin-inline-end:14px;letter-spacing:-.5px}nav b i{color:var(--b);font-style:normal}
nav a{padding:6px 13px;border-radius:99px;color:var(--mut);cursor:pointer;font-size:14px;font-weight:600}
nav a.on,nav a:hover{background:var(--bl);color:var(--b)}
main{min-height:80vh}.w{padding:40px 5vw;max-width:1180px;margin:auto}
h1{font-size:clamp(34px,7vw,64px);line-height:1.15}h2{font-size:clamp(24px,4vw,38px);margin-bottom:6px}
.btn{background:var(--b);color:#fff;border:0;padding:12px 24px;border-radius:99px;font:600 15px inherit;font-family:inherit;cursor:pointer;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px #1f4bff44}.btn.g{background:var(--bl);color:var(--b)}.btn.s{padding:7px 16px;font-size:13px}
.hero{position:relative;min-height:88vh;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:20px;padding:30px 5vw;max-width:1280px;margin:auto}
.hero p{color:var(--mut);font-size:18px;max-width:480px;margin:18px 0 28px}
.big{font-size:clamp(90px,18vw,230px);font-weight:700;letter-spacing:-8px;line-height:.85;color:var(--b)}
.stage{position:relative;height:520px;perspective:1100px}
.sc{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(calc(-16deg + var(--mx,0)*10deg)) rotateX(calc(8deg + var(--my,0)*-8deg));transition:transform .15s}
.orb{position:absolute;width:260px;height:260px;border-radius:50%;inset-inline-start:15%;top:12%;background:radial-gradient(circle at 30% 28%,#fff 0,#9db6ff 18%,#1f4bff 60%,#0a1f7a 100%);box-shadow:0 50px 80px #1f4bff44;transform:translateZ(60px);animation:fl 7s ease-in-out infinite}
.pl{position:absolute;background:#fff;border:1px solid var(--ln);border-radius:20px;padding:18px 20px;box-shadow:0 30px 60px #0b1b3a1a;font-weight:700}
.p1{width:230px;top:48%;inset-inline-end:2%;transform:translateZ(130px);animation:fl 6s -2s ease-in-out infinite}
.p2{width:190px;top:6%;inset-inline-end:8%;transform:translateZ(20px);background:var(--bl);animation:fl 8s -1s ease-in-out infinite}
.p3{width:200px;bottom:4%;inset-inline-start:2%;transform:translateZ(90px);animation:fl 7s -4s ease-in-out infinite}
.pl small{display:block;color:var(--mut);font-weight:400}.pl em{font-style:normal;color:var(--b);font-size:30px;display:block;line-height:1.2}
@keyframes fl{50%{translate:0 -16px}}
.gl{position:absolute;font:700 120px 'Space Grotesk';color:#1f4bff12;pointer-events:none;user-select:none}
.sub{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-top:26px}
.sb{border-radius:28px;padding:28px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.35s;position:relative;overflow:hidden}
.sb:hover{transform:translateY(-6px) rotate(-.4deg)}.sb .ic{font-size:70px;font-weight:700;line-height:1;opacity:.95}
.s1{grid-column:span 7;background:var(--b);color:#fff}.s2{grid-column:span 5;background:var(--bl)}.s3{grid-column:span 5;background:var(--bl)}.s4{grid-column:span 7;border:1px solid var(--ln)}
.rv{opacity:0;transform:translateY(28px);transition:1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.card{background:#fff;border:1px solid var(--ln);border-radius:22px;padding:22px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.chip{padding:6px 15px;border:1px solid var(--ln);border-radius:99px;cursor:pointer;font-size:14px}.chip.on{background:var(--b);color:#fff;border-color:var(--b)}
.opt{display:block;width:100%;text-align:start;padding:11px 16px;margin:7px 0;border:1px solid var(--ln);border-radius:14px;background:#fff;font:inherit;cursor:pointer;transition:.2s}

.tag{font-size:12px;color:var(--b);background:var(--bl);padding:2px 10px;border-radius:99px}
.ex{background:var(--bl);border-radius:14px;padding:12px 16px;margin-top:10px;font-size:14px}
.bar{height:10px;background:var(--bl);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b);border-radius:9px;transition:1s}
.num{font:700 46px 'Space Grotesk';color:var(--b);line-height:1}
input,select,textarea{font:inherit;width:100%;padding:11px 14px;border:1px solid var(--ln);border-radius:12px;margin:5px 0;background:#fff;color:var(--ink)}
.chat{height:52vh;overflow:auto;padding:6px}.m{max-width:82%;padding:11px 16px;border-radius:18px;margin:8px 0;white-space:pre-wrap}.m.u{background:var(--b);color:#fff;margin-inline-start:auto;border-end-end-radius:4px}.m.a{background:var(--bl);border-end-start-radius:4px}
.timer{position:sticky;top:60px;z-index:5;background:var(--b);color:#fff;padding:8px 20px;border-radius:99px;width:max-content;font:700 18px 'Space Grotesk'}
.ach{opacity:.35;text-align:center;padding:14px}.ach.on{opacity:1}.ach b{font-size:32px;display:block}
@media(max-width:800px){.hero{grid-template-columns:1fr;min-height:auto}.stage{height:400px}.s1,.s2,.s3,.s4{grid-column:span 12}.big{letter-spacing:-4px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

async function send(t){const i=$('#ci');t=t||(i&&i.value.trim());if(!t||!sample)return;S.chat.push({r:'u',t});S.chat.push({r:'a',t:'...'});go('ai');
 const w=S.qs.find(q=>q.id===S.p.lw),weak=Object.entries(S.p.st).filter(x=>x[1].a).sort((a,b)=>a[1].c/a[1].a-b[1].c/b[1].a)[0];
 const cx=ctxFor(t),ins=`أنت مساعد تعليمي اسمه Kovix لطلاب التوجيهي في الأردن (الرياضيات، العربية، التربية الإسلامية، تاريخ الأردن). أجب بالعربية الواضحة فقط. اشرح خطوة بخطوة وبسّط الصعب. عند الخطأ لا تعطِ الجواب مباشرة؛ اسأل الطالب سؤالاً يوجّهه ثم اشرح سبب الخطأ. عند طلب أسئلة تدريبية ولّدها مع الحل المخفي بعد الأسئلة. كن مختصراً ودقيقاً، وإن لم تكن متأكداً قل ذلك.\nاسم الطالب: ${S.p.name}. ${weak?'أضعف مبحث عنده: '+SUBJ[weak[0]]+'.':''} ${w?`آخر سؤال أخطأ فيه: "${w.t}" الصحيح: "${w.o[w.c]}" والشرح: ${w.x}`:''}${cx?`\n\nمقتطف من الكتاب المدرسي (${cx.src}). النص مستخرج من PDF وقد تظهر فيه أخطاء حروف فصحّحها ولا تنسخها:\n${cx.text}\nاعتمد على هذا النص في إجابتك واذكر اسم الدرس. إن لم يغطِّ النص السؤال فقل ذلك صراحة.`:''}\n\nالمحادثة السابقة:\n${S.chat.slice(-9,-2).map(m=>(m.r==='u'?'الطالب: ':'المساعد: ')+m.t).join('\n')}\n\nالطالب: ${t}`;
 try{const r=await sample(ins,{cache:false,onText:x=>{S.chat[S.chat.length-1].t=x.text;const b=document.querySelectorAll('.m.a');if(b.length)b[b.length-1].textContent=x.text;const c=$('#ch');if(c)c.scrollTop=1e9}});S.chat[S.chat.length-1].t=r.text;S.chat[S.chat.length-1].src=cx&&cx.src}
 catch(e){S.chat[S.chat.length-1].t='تعذّر الاتصال بالمساعد الآن. حاول مجدداً.'}go('ai');const c=$('#ch');if(c)c.scrollTop=1e9}
function ctxFor(q){const F=flat();let L=S.lesson&&F.find(x=>x.id===S.lesson);
 if(!L){const tk=(q.match(/[\u0600-\u06ff]{3,}/g)||[]).map(w=>w.replace(/^ال/,''));let best=0;F.forEach(x=>{const tx=KB.x[x.id]||'';let sc=0;tk.forEach(w=>{if(x.t.includes(w))sc+=8;sc+=Math.min(tx.split(w).length-1,6)});if(sc>best){best=sc;L=x}});if(best<8)L=null}
 return L?{src:KB.b.find(b=>b.id===L.s).name+' — '+L.t,text:(KB.x[L.id]||'').slice(0,6000)}:null}
function dp(){const t=S.p.date?new Date(S.p.date+'T00:00'):new Date();return{y:t.getFullYear(),m:t.getMonth()+1,d:t.getDate()}}
function stp(k,l,v){return `<div class="stp"><small>${l}</small><button class="btn s g" onclick="step('${k}',1)">▲</button><div class="num" style="font-size:34px">${v}</div><button class="btn s g" onclick="step('${k}',-1)">▼</button></div>`}
function step(k,n){const p=S.p;if(k==='h'){p.hrs=Math.min(12,Math.max(1,(+p.hrs||3)+n))}else{let{y,m,d}=dp();const Y=new Date().getFullYear();if(k==='y')y=Math.min(Y+3,Math.max(Y,y+n));if(k==='m')m=(m-1+n+12)%12+1;const dm=new Date(y,m,0).getDate();if(k==='d')d=(d-1+n+dm)%dm;d=Math.min(k==='d'?d+1:d,dm);p.date=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')}save();go('plan')}
async function summ(id){const el=$('#sm');if(S.p.sm[id])return el.textContent=S.p.sm[id];if(!sample)return toast('المساعد غير متاح في هذا العرض');el.textContent='جارٍ التلخيص...';const L=flat().find(x=>x.id===id);
 try{const r=await sample('لخّص الدرس التالي لطالب توجيهي أردني بالعربية: الأفكار والمفاهيم والتواريخ أو القوانين المهمة في نقاط مرتبة، ثم 3 نقاط يركّز عليها الامتحان. النص مستخرج من PDF وفيه أخطاء حروف فصحّحها. الدرس: '+L.t+'\n\n'+KB.x[id].slice(0,9000));S.p.sm[id]=r.text;save();el.textContent=r.text}catch(e){el.textContent='تعذّر التلخيص الآن، حاول مجددًا.'}}
function exOne(id){const L=flat().find(x=>x.id===id);go('exam');$('#gb').value=L.s;fillL();$('#gl').value=id;$('#gb').scrollIntoView()}
function aiCard(){return `<div class="card" style="margin-top:26px;border-color:var(--b)"><h2 style="font-size:22px">✨ امتحان بالذكاء الاصطناعي من كتابك</h2><p style="color:var(--mut)">يولّد أسئلة من نص الدرس نفسه. الأسئلة المولّدة قد تحتوي أخطاء، فأبلغ عنها من زر «إبلاغ» بعد الامتحان.</p><div class="grid"><select id="gb" onchange="fillL()">${Object.entries(SUBJ).map(k=>`<option value="${k[0]}">${k[1]}</option>`).join('')}</select><select id="gl"></select><select id="gn"><option>5</option><option>10</option></select><select id="gd"><option>سهل</option><option selected>متوسط</option><option>صعب</option></select></div><button class="btn" id="gbtn" onclick="genExam()">ولّد الامتحان</button></div>`}
function fillL(){const b=KB.b.find(x=>x.id===$('#gb').value);$('#gl').innerHTML='<option value="">كل دروس الكتاب</option>'+b.units.map(u=>u.ls.map(l=>`<option value="${l[0]}">${esc(u.t)} — ${esc(l[1])}</option>`).join('')).join('')}
async function genExam(){if(!sample)return toast('الذكاء الاصطناعي غير متاح في هذا العرض');const b=$('#gb').value,l=$('#gl').value,n=+$('#gn').value,d=$('#gd').value,btn=$('#gbtn'),all=flat().filter(x=>x.s===b),pk=l?all.filter(x=>x.id===l):[...all].sort(()=>Math.random()-.5).slice(0,3),per=l?7000:2800;
 btn.disabled=true;btn.textContent='جارٍ التوليد... قد يستغرق دقيقة';
 try{const r=await sample.json('أنت معدّ امتحانات وزارة التربية والتعليم الأردنية لمبحث '+SUBJ[b]+' (الصف الحادي عشر). ولّد '+n+' أسئلة اختيار من متعدد بمستوى '+d+' اعتمادًا فقط على نص الكتاب أدناه (مستخرج من PDF وفيه أخطاء حروف: صحّحها ولا تنسخها). لكل سؤال 4 خيارات وإجابة صحيحة واحدة وشرح قصير بالعربية، ولا تسأل عن أرقام الصفحات. أعد JSON فقط: مصفوفة عناصرها {"t":نص السؤال,"o":[أربعة خيارات],"c":رقم الصحيح من 0 إلى 3,"x":الشرح,"l":اسم الدرس}.\n\nالنص:\n'+pk.map(x=>'### '+x.t+'\n'+(KB.x[x.id]||'').slice(0,per)).join('\n\n'));
  const qs=(Array.isArray(r)?r:r.questions||[]).filter(q=>q&&q.t&&Array.isArray(q.o)&&q.o.length===4&&Number.isInteger(q.c)&&q.c>=0&&q.c<4).slice(0,n).map((q,i)=>({id:'g'+Date.now()+i,s:b,u:'ذكاء اصطناعي',l:q.l||pk[0].t,t:String(q.t),o:q.o.map(String),c:q.c,x:String(q.x||''),g:1}));
  if(qs.length<2)throw 0;qs.forEach(q=>S.qs.push(q));startE(b,qs)}catch(e){toast('تعذّر توليد الامتحان، حاول مرة أخرى');btn.disabled=false;btn.textContent='ولّد الامتحان'}}
async function explain(id){const q=S.qs.find(x=>x.id===id),a=S.E&&S.E.a[id],el=$('#ei_'+id);if(!sample)return toast('غير متاح');el.innerHTML='<div class="ex">جارٍ الشرح...</div>';
 try{const r=await sample('أنت مدرّس لطلاب التوجيهي في الأردن. السؤال: '+q.t+'\nالخيارات: '+q.o.join(' | ')+'\nإجابة الطالب: '+(a==null?'لم يجب':q.o[a])+'\nالصحيحة: '+q.o[q.c]+'\nالدرس: '+q.l+'\nاشرح بالعربية وباختصار لماذا أخطأ الطالب ولماذا الصحيحة صحيحة، ثم اطرح عليه سؤالًا قصيرًا يتأكد به من فهمه.');el.innerHTML='<div class="ex" style="white-space:pre-wrap">'+esc(r.text)+'</div>'}catch(e){el.innerHTML='<div class="ex">تعذّر الشرح الآن</div>'}}
async function report(id){const q=S.qs.find(x=>x.id===id);if(!db)return toast('الإبلاغ يحتاج تسجيل الدخول');try{await db.collection('reports').doc('r'+Date.now()).set({q,by:S.p.name,at:Date.now()});toast('وصل بلاغك للمشرف، شكرًا')}catch(e){toast('تعذّر الإرسال')}}
async function approve(id){const q=S.qs.find(x=>x.id===id);if(!db)return;const c={...q};delete c.id;delete c.g;try{await db.collection('questions').doc('q'+Date.now()).set(c);toast('أُضيف للبنك الدائم')}catch(e){toast('تعذّر الحفظ')}}
function repCard(){return `<div class="card"><h2 style="font-size:20px">بلاغات الأخطاء (${S.rep.length})</h2>${S.rep.map(r=>`<p>${esc(r.q.t)}<br><small>الصحيح عند النظام: ${esc(r.q.o[r.q.c])} · من ${esc(r.by)}</small><br><button class="btn s" onclick="appr('${r.id}')">اعتماد للبنك</button> <button class="btn s g" onclick="delR('${r.id}')">حذف</button></p>`).join('')||'—'}</div>`}
async function appr(id){const r=S.rep.find(x=>x.id===id),c={...r.q};delete c.id;delete c.g;try{await db.collection('questions').doc('q'+Date.now()).set(c);await db.collection('reports').doc(id).delete();S.rep=S.rep.filter(x=>x.id!==id);go('admin')}catch(e){toast('تعذّر')}}
async function delR(id){try{await db.collection('reports').doc(id).delete();S.rep=S.rep.filter(x=>x.id!==id);go('admin')}catch(e){toast('تعذّر')}}
init();
</script></body></html>
